app = "nfe-preflight"
primary_region = "gru"

# O site é gerado no build da imagem, então estes valores vêm daqui e não de `fly secrets`.
[build.args]
  SITE_URL = "https://nfepreflight.com.br"
  CONTACT_EMAIL = ""
  DONATE_URL = "https://ko-fi.com/altair_br"

[[mounts]]
  source = "nfe_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
