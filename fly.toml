# Antes do primeiro deploy: troque `app` por um nome livre e SITE_URL pelo seu domínio.
app = "nfe-preflight"
primary_region = "gru"

[build.args]
  SITE_URL = "https://nfepreflight.com.br"
  CONTACT_EMAIL = ""
  DONATE_URL = ""

[[mounts]]
  source = "nfe_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
